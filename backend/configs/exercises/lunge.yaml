exercise: lunge
display_name: Zancadas
description: Paso amplio hacia delante flexionando ambas rodillas con el tronco erguido.
icon: "🚶"
preferred_view: side
is_isometric: false
required_keypoints:
  - shoulder
  - hip
  - knee
  - ankle
phase_metric: front_knee_angle
hysteresis_degrees: 5.0
confirm_frames: 2

levels:
  easy:
    display_name: Fácil
    up_threshold: 155.0
    down_threshold: 112.0
    trunk_lean_max_angle: 28.0
    knee_over_toe_ratio: 0.35
    min_phase_seconds: 0.0
    symmetry_tolerance: 25.0
    rules_enabled:
      - trunk_vertical
      - full_rom
  medium:
    display_name: Medio
    up_threshold: 162.0
    down_threshold: 98.0
    trunk_lean_max_angle: 20.0
    knee_over_toe_ratio: 0.25
    min_phase_seconds: 0.35
    symmetry_tolerance: 16.0
    rules_enabled:
      - trunk_vertical
      - knee_tracking
      - full_rom
  advanced:
    display_name: Avanzado
    up_threshold: 168.0
    down_threshold: 90.0
    trunk_lean_max_angle: 14.0
    knee_over_toe_ratio: 0.18
    min_phase_seconds: 0.6
    symmetry_tolerance: 10.0
    rules_enabled:
      - trunk_vertical
      - knee_tracking
      - full_rom
      - tempo
      - symmetry

penalties:
  trunk_vertical: 25.0
  knee_tracking: 20.0
  full_rom: 25.0
  tempo: 15.0
  symmetry: 15.0

messages:
  trunk_vertical: "Mantén el torso erguido y perpendicular al suelo"
  knee_tracking: "Evita que la rodilla delantera sobrepase demasiado el tobillo"
  full_rom: "Baja más hasta que la rodilla delantera forme ~90°"
  tempo: "Desciende de forma más pausada y estable"
  symmetry: "Mantén la estabilidad entre ambas piernas"

